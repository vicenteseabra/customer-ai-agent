<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Store Chat</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main id="chat-app">
    <header>
      <h1>EMPÓRIO DA MÚSICA - Chat</h1>
      <p class="subtitle">Ask about products, promotions, policies, or your orders.</p>
    </header>

    <section id="messages" role="log" aria-live="polite" aria-label="Chat messages"></section>

    <p id="status" role="status" aria-live="polite"></p>

    <form id="chat-form" autocomplete="off">
      <label for="message-input" class="visually-hidden">Your message</label>
      <input
        type="text"
        id="message-input"
        name="message"
        placeholder="Type your message..."
        maxlength="4000"
        required
      />
      <button type="submit">Send</button>
    </form>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
