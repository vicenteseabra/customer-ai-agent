[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "store-chat"
version = "0.1.0"
description = "Local, English-language self-service chat backend for a musical instrument store."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "ollama>=0.3",
    "google-genai>=1.0",
    "chromadb>=0.5",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "reportlab>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
store_chat = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
